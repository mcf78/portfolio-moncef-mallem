<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio BTS SIO - Moncef MALLEM</title>
    <meta name="description" content="Portfolio BTS SIO de Moncef MALLEM, Développeur Application Mobile - PrestaShop." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08090a" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23533afd'/%3E%3Ctext x='32' y='41' font-family='Inter,Arial,sans-serif' font-size='25' font-weight='700' fill='white' text-anchor='middle'%3EMM%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Applique le thème (choix mémorisé, sinon celui du système) avant le premier affichage : pas de flash.
      (function () {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
